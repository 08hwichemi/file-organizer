# 사용 설명서(docs/manual)가 바뀌어 main에 병합되면 공개 저장소
# 08hwichemi/file-organizer-releases 의 gh-pages 가지에 올린다.
# 주소는 늘 같다: https://08hwichemi.github.io/file-organizer-releases/
#
# 필요한 GitHub Secrets: RELEASES_TOKEN (배포와 같은 토큰). 없으면 건너뛴다.
name: 설명서 올리기

on:
  push:
    branches: [main]
    paths:
      - "docs/manual/**"
      - "docs/install-image/install-guide.png"
      - ".github/workflows/manual.yml"
  workflow_dispatch:

concurrency:
  group: manual
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  manual:
    name: 설명서 올리기
    runs-on: ubuntu-latest
    steps:
      - name: 준비 확인
        id: ready
        env:
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning title=설명서 올리기 건너뜀::GitHub Secrets에 RELEASES_TOKEN을 넣으면 설명서도 자동으로 올라가요."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.ready.outputs.ok == 'true'

      - uses: actions/setup-node@v5
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      # 글꼴(pretendard)만 쓰므로 설치 스크립트는 돌리지 않는다
      - name: 의존성 설치
        if: steps.ready.outputs.ok == 'true'
        run: npm ci --ignore-scripts

      - name: 설명서 묶음 만들기
        if: steps.ready.outputs.ok == 'true'
        run: node docs/manual/tools/site.mjs site

      - name: gh-pages에 올리기
        if: steps.ready.outputs.ok == 'true'
        env:
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "사용 설명서 (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${TOKEN}@github.com/08hwichemi/file-organizer-releases.git" gh-pages
