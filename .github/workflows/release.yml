# main에 병합될 때마다 새 버전(0.1.<실행 번호>)을 만들어 공개 저장소
# 08hwichemi/file-organizer-releases 의 Releases에 올린다.
# 설치된 프로그램은 거기 있는 latest.json을 보고 스스로 업데이트한다.
#
# 필요한 GitHub Secrets(이 저장소 Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           업데이트 서명 개인 키(저장소에 커밋 금지)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  그 키의 암호
#   RELEASES_TOKEN                      file-organizer-releases에 쓰기 권한이 있는 토큰
# 하나라도 없으면 배포를 건너뛴다(실패로 표시하지 않음).
name: 배포

on:
  push:
    branches: [main]
    # 설명서·문서만 바뀐 병합은 새 버전을 만들지 않는다(프로그램이 그대로인데 업데이트 알림이 뜨지 않게).
    # 설명서는 manual.yml이 따로 올린다. 프로그램 파일이 하나라도 바뀌면 배포한다.
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/workflows/manual.yml"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASES_OWNER: 08hwichemi
  RELEASES_REPO: file-organizer-releases

jobs:
  release:
    name: 새 버전 배포
    runs-on: windows-latest
    steps:
      - name: 배포 준비 확인
        id: ready
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$KEY" ] || [ -z "$TOKEN" ]; then
            echo "::warning title=배포 건너뜀::GitHub Secrets에 TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD, RELEASES_TOKEN을 넣으면 자동 배포가 시작돼요."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.ready.outputs.ok == 'true'

      - uses: actions/setup-node@v5
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.ready.outputs.ok == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.ready.outputs.ok == 'true'
        with:
          workspaces: src-tauri

      - name: 화면 의존성 설치
        if: steps.ready.outputs.ok == 'true'
        run: npm ci

      # 버전은 실행할 때마다 1씩 올라간다(PR용 시험판은 그때 최신 배포 + 1이라, 병합 뒤 정식판이 같거나 높다).
      - name: 버전 정하기
        if: steps.ready.outputs.ok == 'true'
        shell: bash
        run: |
          VERSION="0.1.${{ github.run_number }}"
          npm version "$VERSION" --no-git-tag-version
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Everything SDK 받기(파일 검색용, 못 받아도 계속)
        if: steps.ready.outputs.ok == 'true'
        shell: pwsh
        run: ./scripts/fetch-everything-sdk.ps1

      - name: 설치 파일 만들기(업데이트 서명 포함)
        if: steps.ready.outputs.ok == 'true'
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # 설치 파일 이름에 한글이 있으면(예전 "파일 정리 도우미_…") GitHub가 올릴 때 이름을 바꿔 버려
      # 업데이트 주소가 맞지 않는다. 그래서 영문 이름으로 바꾸고 latest.json을 직접 만든다.
      - name: 공개 저장소에 올리기
        if: steps.ready.outputs.ok == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          OUT="release-files"
          bash scripts/prepare-release.sh "src-tauri/target/release/bundle/nsis" "$OUT" "$VERSION" \
            "https://github.com/${RELEASES_OWNER}/${RELEASES_REPO}/releases/download/v${VERSION}"
          gh release create "v${VERSION}" \
            --repo "${RELEASES_OWNER}/${RELEASES_REPO}" \
            --target main \
            --title "AutoFolder ${VERSION}" \
            --notes "아래 Assets에서 AutoFolder_${VERSION}_x64-setup.exe 를 받아 실행하세요. 이미 설치했다면 받을 필요 없어요. 프로그램이 알아서 새 버전을 알려 드려요. 교육·개인·업무 용도로 무료로 쓸 수 있고, 판매는 할 수 없어요(이용 조건: 설정 → 정보)." \
            "$OUT"/*
