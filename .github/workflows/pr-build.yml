# PR마다: 화면 빌드·Rust 테스트를 검사하고, Windows 설치 파일(.exe)을 아티팩트로 올린다.
# 설치 파일은 Actions 실행 결과 페이지 아래 "Artifacts"에서 받는다.
# 정식 배포(v* 태그 → Releases 업로드·업데이트 서명)는 8단계에서 따로 만든다.
name: PR 빌드

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 검사 (화면 빌드 · Rust 테스트)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 화면 의존성 설치
        run: npm ci

      - name: 화면 타입 검사·빌드
        run: npm run build

      - name: Tauri 리눅스 빌드 도구 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust 형식 검사
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust 린트
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust 단위 테스트
        working-directory: src-tauri
        run: cargo test

  windows-installer:
    name: Windows 설치 파일
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 화면 의존성 설치
        run: npm ci

      - name: 설치 파일 만들기 (NSIS)
        run: npm run tauri build

      - name: 설치 파일 올리기
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup-${{ github.run_number }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
