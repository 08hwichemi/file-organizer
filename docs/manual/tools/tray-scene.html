<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 설명서 '처음 설정' 7장의 그림(tray.webp): 작업 표시줄 오른쪽 아래의 AutoFolder 트레이 아이콘과 오른쪽 클릭 메뉴.
     메뉴 글은 src-tauri/src/tray.rs와 같게(열기 · 정리함 (n) · 파일 검색 · 일시 정지 · ─ · 끄기). 1000×620 기준.
     찍기: node docs/manual/tools/shots.mjs windows -->
<style>
@font-face{font-family:"Pretendard Variable";font-weight:45 920;src:url("../../../node_modules/pretendard/dist/web/variable/woff2/PretendardVariable.woff2") format("woff2")}
*{box-sizing:border-box}
body{margin:0;width:1000px;height:620px;overflow:hidden;font-family:"Pretendard Variable",sans-serif;background:#2a5597;position:relative}
.task{position:absolute;left:0;right:0;bottom:0;height:76px;background:#f3f3f3;border-top:1px solid #d9d9d9}
.apps{position:absolute;left:40px;bottom:14px;display:flex;gap:12px}.apps i{width:48px;height:48px;border-radius:9px;display:block}
.tray{position:absolute;right:20px;bottom:0;height:76px;display:flex;align-items:center;gap:18px;color:#222}
.chev{font-size:26px;color:#444;width:40px;text-align:center}
.sys{display:flex;gap:14px}.sys svg{width:26px;height:26px}
.af{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;position:relative}
.af img{width:34px;height:34px}
.ring{position:absolute;inset:-7px;border:5px solid #E8590C;border-radius:14px}
.clock{font-size:17px;text-align:right;line-height:1.35}
.menu{position:absolute;right:150px;bottom:92px;width:270px;background:#fff;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.35);padding:8px;font-size:21px;color:#1b1b1b}
.menu div{padding:11px 16px;border-radius:7px}
.menu div.on{background:#eef2fb}
.menu hr{border:0;border-top:1px solid #e5e5e5;margin:6px 4px}
.say{position:absolute;background:#E8590C;color:#fff;font-weight:800;font-size:24px;line-height:1.35;padding:14px 20px;border-radius:12px}
.say.a{right:440px;top:300px}
.say.b{right:338px;top:556px;font-size:18px;padding:8px 14px;z-index:5;line-height:1.3}
.say.a:after,.say.b:after{content:"";position:absolute;right:-20px;top:calc(50% - 12px);border-style:solid;border-width:12px 0 12px 22px;border-color:transparent transparent transparent #E8590C}
</style>
</head><body>
<div class="say a">눌러서 열고,<br>오른쪽 클릭하면 이 메뉴</div>
<div class="say b">아이콘이 안 보이면 ^ 를 눌러요</div>
<div class="menu"><div>열기</div><div class="on">정리함 (3)</div><div>파일 검색</div><div>일시 정지</div><hr><div>끄기</div></div>
<div class="task"><div class="apps"><i style="background:#2b6fd6"></i><i style="background:#c9c9c9"></i><i style="background:#f2c94c"></i><i style="background:#2f80ed"></i></div></div>
<div class="tray"><span class="chev">^</span>
 <span class="sys"><svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"><path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1" fill="#333"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg></span>
 <span class="af"><img src="../../../src-tauri/icons/128x128.png" alt=""><span class="ring"></span></span>
 <span class="clock">오전 10:52<br>2026-10-18</span></div>
</body></html>
