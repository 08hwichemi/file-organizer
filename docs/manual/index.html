<title>AutoFolder 사용 설명서</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* 한 화면에 한 장면. 위: 차례(장), 가운데: 글+화면이 한 카드, 아래: 이전/진행/다음.
     색·글꼴은 AutoFolder 프로그램과 같게. 장면 내용은 아래 스크립트의 S 배열만 고치면 된다. */
  @font-face {
    font-family: "Pretendard Variable";
    font-weight: 45 920;
    font-display: swap;
    /* 올린 설명서에는 글꼴 파일을 같이 올리고, 저장소에서 열 때는 node_modules의 것을 쓴다 */
    src: url("PretendardVariable.woff2") format("woff2"), url("../../node_modules/pretendard/dist/web/variable/woff2/PretendardVariable.woff2") format("woff2");
  }
  :root {
    --bg: #F4F5F7;
    --surface: #FFFFFF;
    --surface-sub: #F7F8FA;
    --fg: #17191C;
    --sub: #5F6670;
    --line: #E4E6EA;
    --accent: #2B59C3;
    --accent-hover: #2349A3;
    --accent-soft: #E7EEFB;
    --folder: #E3B23C;
    --folder-light: #F5CB5C;
    --ok: #1B6E43;
    --hl: #E8590C;
    --hl-soft: #FDEBDD;
    --ex: #8A5A00;
    --ex-soft: #FFF3D6;
    --shot-shadow: 0 10px 28px rgba(23, 25, 28, 0.13);
    --font: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121418; --surface: #1B1E24; --surface-sub: #22262D; --fg: #EDEFF2; --sub: #A3AAB4;
      --line: #2E333B; --accent: #6E95F0; --accent-hover: #8EADF5; --accent-soft: #23304D;
      --ok: #6CC596; --hl: #FF8A4C; --hl-soft: #3A2516; --ex: #F2C46B; --ex-soft: #3A2F16;
      --shot-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121418; --surface: #1B1E24; --surface-sub: #22262D; --fg: #EDEFF2; --sub: #A3AAB4;
    --line: #2E333B; --accent: #6E95F0; --accent-hover: #8EADF5; --accent-soft: #23304D;
    --ok: #6CC596; --hl: #FF8A4C; --hl-soft: #3A2516; --ex: #F2C46B; --ex-soft: #3A2F16;
    --shot-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }

  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.6;
    word-break: keep-all;
    overflow-wrap: anywhere;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 1320px;
    margin: 0 auto;
    padding-block: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    gap: 12px;
  }
  .nw { white-space: nowrap !important; }

  /* 위: 이름 + 차례 */
  .top { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 750; font-size: 17px; white-space: nowrap; }
  .logo { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; flex-shrink: 0; }
  .brand small { font-weight: 500; color: var(--sub); font-size: 14px; }
  .toc {
    display: flex; gap: 2px; flex-wrap: nowrap; overflow-x: auto;
    margin-left: auto; padding: 4px; min-width: 0;
    border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
    scrollbar-width: none;
  }
  .toc::-webkit-scrollbar { display: none; }
  .toc button {
    display: inline-flex; align-items: center; gap: 5px;
    min-height: 36px; padding: 0 11px; flex-shrink: 0;
    border: 0; border-radius: 9px; background: transparent;
    color: var(--sub); font: inherit; font-size: 14px; font-weight: 600;
    white-space: nowrap; cursor: pointer;
  }
  .toc button:hover { background: var(--surface-sub); color: var(--fg); }
  .toc button[aria-current="step"] { background: var(--accent-soft); color: var(--accent); }
  .toc .star { color: var(--folder); font-size: 11px; }

  /* 가운데: 한 장면 */
  .stage { flex: 1; min-height: 0; display: flex; }
  .scene {
    flex: 1; min-height: 0; min-width: 0;
    display: grid;
    grid-template-columns: minmax(300px, 0.8fr) minmax(0, 1.45fr);
    gap: clamp(20px, 3vw, 48px);
    align-items: center;
    padding: clamp(20px, 3vw, 44px);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: auto;
    animation: in 0.22s ease-out;
  }
  .scene:focus { outline: none; }
  @keyframes in { from { opacity: 0.4; transform: translateX(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .scene { animation: none; } }

  .text { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .chip {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 4px 12px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 13.5px; font-weight: 700; white-space: nowrap;
  }
  .chip span { font-weight: 600; opacity: 0.8; font-variant-numeric: tabular-nums; }
  h1, h2, h3 { margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  h1 { font-size: clamp(30px, 3.6vw, 44px); line-height: 1.25; font-weight: 800; }
  h2 { font-size: clamp(24px, 2.5vw, 31px); line-height: 1.3; font-weight: 800; }
  .text p { margin: 0; font-size: 17px; color: var(--sub); text-wrap: pretty; }
  .text p b { color: var(--fg); font-weight: 700; }
  b.mark { color: var(--fg); font-weight: 750; box-shadow: inset 0 -0.42em 0 var(--hl-soft); }
  .btnlike {
    display: inline-block; padding: 0 8px; border-radius: 6px;
    background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 15px; line-height: 1.65;
  }
  .key {
    display: inline-block; min-width: 1.6em; padding: 0 7px; text-align: center;
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px;
    background: var(--surface-sub); color: var(--fg); font-size: 14px; font-weight: 650; line-height: 1.6;
  }
  .copy {
    display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
    padding: 6px 6px 6px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-sub);
  }
  .copy code {
    flex: 1; min-width: 0; font-family: var(--font); font-size: 15px; font-weight: 650; color: var(--fg);
    word-break: break-all; line-height: 1.45;
  }
  .copy button {
    flex-shrink: 0; min-height: 36px; padding: 0 14px; border-radius: 9px; border: 0;
    background: var(--accent); color: #fff; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .copy button:hover { background: var(--accent-hover); }
  .tip {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 12px 14px; border-radius: 12px; background: var(--surface-sub);
  }
  .tip svg { flex-shrink: 0; margin-top: 4px; color: var(--ok); }
  .tip > span { color: var(--sub); font-size: 15px; text-wrap: pretty; }
  .legend { display: inline-flex; align-items: center; gap: 8px; color: var(--sub); font-size: 13.5px; }
  .legend i { width: 18px; height: 12px; border: 2.5px solid var(--hl); border-radius: 4px; flex-shrink: 0; }

  /* 화면 그림 */
  .fig { margin: 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .fig img {
    display: block; max-width: 100%; height: auto;
    max-height: calc(100dvh - 220px);
    object-fit: contain;
    border-radius: 14px; border: 1px solid var(--line); box-shadow: var(--shot-shadow); background: #fff;
  }
  .extag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px; background: var(--ex-soft); color: var(--ex);
    font-size: 13px; font-weight: 650; white-space: nowrap;
  }

  /* 첫 장 */
  .cover { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .cover .text { gap: 18px; }
  .cover .text p { font-size: 18px; max-width: 30em; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--sub); font-size: 15px; }
  .facts span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .facts svg { color: var(--ok); }
  .order { margin: 2px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--sub); font-size: 14.5px; }
  .order li { white-space: nowrap; }
  .order li b { color: var(--fg); font-weight: 650; }
  .tiles { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .tile {
    display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 18px; align-items: center;
    padding: 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface-sub);
  }
  .tile img { width: 132px; height: 104px; object-fit: cover; object-position: top left; border-radius: 10px; border: 1px solid var(--line); background: #fff; }
  .tile small { display: inline-block; color: var(--accent); font-size: 13px; font-weight: 750; }
  .tile small .star { color: var(--folder); }
  .tile strong { display: block; font-size: 19px; line-height: 1.35; margin: 2px 0 4px; }
  .tile p { margin: 0; color: var(--sub); font-size: 15px; text-wrap: pretty; }

  /* 자주 묻는 것 */
  .faq { grid-template-columns: 1fr; align-content: start; align-items: start; }
  .qa { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .qa div { padding: 14px 16px; border-radius: 14px; background: var(--surface-sub); }
  .qa h3 { margin: 0 0 4px; font-size: 16px; }
  .qa p { margin: 0; color: var(--sub); font-size: 14.5px; line-height: 1.55; text-wrap: pretty; }
  .terms { margin: 0; color: var(--sub); font-size: 13.5px; }
  .faq { gap: 16px; }
  @media (max-height: 800px) and (min-width: 861px) {
    .faq { padding-block: 20px; }
    .qa { gap: 10px; }
    .qa div { padding: 11px 14px; }
    .qa p { font-size: 14px; line-height: 1.5; }
  }

  /* 아래: 이전 / 진행 / 다음 */
  .nav { display: flex; align-items: center; gap: 14px; flex-wrap: nowrap; }
  .nav button.go {
    min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--surface); color: var(--fg); font: inherit; font-weight: 700; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  .nav button.go:hover:not(:disabled) { background: var(--surface-sub); }
  .nav button.go.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .nav button.go.primary:hover:not(:disabled) { background: var(--accent-hover); }
  .nav button.go:disabled { opacity: 0.35; cursor: default; }
  .bar { flex: 1; display: flex; gap: 4px; min-width: 0; }
  .bar span { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; min-width: 8px; }
  .bar span i { display: block; height: 100%; background: var(--accent); transition: width 0.2s; }
  .count { color: var(--sub); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; flex-shrink: 0; }

  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 1000px) {
    .brand small { display: none; }
  }
  @media (max-width: 860px) {
    .top { flex-direction: column; align-items: stretch; gap: 8px; }
    .toc { margin-left: 0; }
    .scene, .cover { grid-template-columns: minmax(0, 1fr); align-items: start; align-content: start; }
    .fig img { max-height: none; }
    .qa { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 480px) {
    .nav { gap: 10px; }
    .nav button.go { padding: 0 12px; }
    .tile { grid-template-columns: 96px minmax(0, 1fr); gap: 14px; padding: 14px; }
    .tile img { width: 96px; height: 80px; }
  }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg width="18" height="16" viewBox="0 0 18 16"><path d="M1.5 2.5A1.5 1.5 0 0 1 3 1h4l1.6 1.8H15A1.5 1.5 0 0 1 16.5 4.3V13a1.5 1.5 0 0 1-1.5 1.5H3A1.5 1.5 0 0 1 1.5 13z" fill="#F5CB5C"/><path d="M1.5 5h15v8a1.5 1.5 0 0 1-1.5 1.5H3A1.5 1.5 0 0 1 1.5 13z" fill="#E3B23C"/></svg>
      </span>
      AutoFolder <small>사용 설명서</small>
    </div>
    <nav class="toc" aria-label="차례" id="toc"></nav>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="nav">
    <button type="button" class="go" id="prev">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>이전
    </button>
    <div class="bar" id="bar" aria-hidden="true"></div>
    <span class="count" id="count" aria-live="polite"></span>
    <button type="button" class="go primary" id="next"></button>
  </footer>
</div>

<script>
(() => {
  // 장(차례). star = 주요 기능
  const CH = [
    { key: "start", name: "시작" },
    { key: "install", name: "설치하기" },
    { key: "setup", name: "처음 설정" },
    { key: "new", name: "새 파일 정리", star: true },
    { key: "classify", name: "자동 분류", star: true },

  const URL_RELEASE = "github.com/08hwichemi/file-organizer-releases/releases/latest";

  // 장면. 글 표시법: [[단추]]  {{키}}  ==강조==  (뒤에 붙은 조사·마침표는 같은 줄에 붙어 다닌다)
  // ex: true = Windows·브라우저 화면이라 예시 그림(실제와 조금 다를 수 있음). hl: true = 그림에 주황 테두리 있음.
  const S = [
    { id: "start", ch: "start", cover: true },

    { id: "install-1", ch: "install", ex: true, hl: true, img: "r-addr.png",
      alt: "크롬 새 탭의 주소 칸에 배포 페이지 주소를 넣은 모습",

      body: [
        "크롬(또는 엣지)을 열고 맨 위 ==주소 칸==을 누르세요. 아래 [[복사]]를 누른 뒤 주소 칸에 {{Ctrl}}+{{V}}로 붙여 넣고 {{Enter}}.",
      ],
      copy: URL_RELEASE,
      tip: "메신저나 메일로 받은 링크가 있으면 그 링크를 눌러도 같은 페이지가 열려요." },

    { id: "install-2", ch: "install", ex: true, hl: true, img: "r-assets.png",
      alt: "배포 페이지 아래쪽 Assets 목록에서 AutoFolder_0.1.22_x64-setup.exe를 누르는 모습",

      body: [

    { id: "install-3", ch: "install", ex: true, hl: true, img: "r-done.png",

    { id: "install-4", ch: "install", ex: true, hl: true, img: "r-edge1.png",

      alt: "추가 정보를 누른 뒤 생긴 실행 버튼을 누르는 모습",

        "열 제목을 누르면 날짜·크기 순으로 정렬되고, 열 사이 경계를 끌면 너비가 바뀌어요. 두 번 누르면 파일이 열려요.",
      ] },

    { id: "more-2", ch: "more", img: "rename.png",
      alt: "이름 바꾸기: 고다윤.pdf를 2026년 고다윤으로 적으면 나머지도 같은 모양으로",
      title: "이름 한꺼번에 바꾸기",
      body: [
        "왼쪽 메뉴 ==이름 바꾸기==에서 폴더를 고르고, <b>첫 파일만</b> 원하는 이름으로 적으면 나머지가 같은 모양으로 따라와요.",
        "번호로 된 파일을 학생 이름으로 바꾸려면 [[명렬표]].",
      ],
      tip: "바꾼 이름도 한 번에 되돌릴 수 있어요." },

    { id: "faq", ch: "faq", faq: true },
  ];

  const FAQ = [
    ["잘못 넣었어요", "넣은 바로 뒤 [되돌리기]를 누르면 원래 자리로 가요. 나중에라도 정리함의 <span class=\"nw\">[최근 정리]</span> 탭에서 되돌릴 수 있어요."],
    ["파일이 지워지진 않나요?", "지우기는 Windows 휴지통으로만 보내요. 같은 이름이 있으면 덮어쓰지 않고 <span class=\"nw\">‘이름 (2)’로</span> 넣어요."],
    ["내려받는 중인 파일은요?", "저장이 끝날 때까지 기다렸다가 창을 띄워요. 받는 중인 파일은 건드리지 않아요."],
    ["창이 자꾸 떠서 귀찮아요", "<span class=\"nw\">설정 → 정리 방식</span>에서 <span class=\"nw\">‘모아 두고 나중에 정리’</span>. 잠깐 멈추려면 트레이 메뉴의 [일시 정지]."],
    ["완전히 끄고 싶어요", "창의 ✕는 숨기기만 해요. 시계 옆 <span class=\"nw\">트레이 아이콘 → [끄기]</span>."],
    ["업데이트는 어떻게 해요?", "새 버전이 나오면 창 위에 <span class=\"nw\">‘새 버전이 있어요’</span>가 떠요. [지금 업데이트]만 누르면 돼요."],
    ["처음 설정을 다시 하고 싶어요", "<span class=\"nw\">설정 → 프로그램</span> → <span class=\"nw\">[처음 설정 다시 하기]</span>. 규칙과 파일은 그대로예요."],
    ["내 파일 정보가 밖으로 나가나요?", "아니요. 파일 이름·경로는 이 PC 안에서만 써요. 인터넷은 업데이트 확인에만 써요."],
    ["다른 선생님께 주려면요?", "이 설명서 링크나 배포 주소를 보내 주세요. 배포 페이지에서 받은 파일만 설치하세요."],
  ];

  function fmt(s) {
    return s
      .replace(/\[\[(.+?)\]\]([가-힣]{0,3}[.,]?)/g, (m, a, b) => `<span class="nw"><span class="btnlike">${a}</span>${b}</span>`)
      .replace(/\{\{(.+?)\}\}([가-힣]{0,3}[.,]?)/g, (m, a, b) => `<span class="nw"><span class="key">${a}</span>${b}</span>`)
      .replace(/\[([^\[\]<>]+?)\]([가-힣]{0,3}[.,]?)/g, (m, a, b) => `<span class="nw">[${a}]${b}</span>`)
      .replace(/‘([^’<]{1,16})’([가-힣]{0,3}[.,]?)/g, (m, a, b) => `<span class="nw">‘${a}’${b}</span>`)
      .replace(/==(.+?)==([가-힣]{0,3}[.,]?)/g, (m, a, b) =>
        a.length <= 12 ? `<span class="nw"><b class="mark">${a}</b>${b}</span>` : `<b class="mark">${a}</b>${b}`);
  }
  const TIP_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 7v4M8 4.6v.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  const CHECK = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.5l3 3 6-7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const chScenes = (key) => S.filter((x) => x.ch === key);
  const chName = (key) => CH.find((c) => c.key === key).name;

  function coverHTML() {
    const order = CH.slice(1).map((c, i) => `<li><b>${i + 1}</b> ${c.name}</li>`).join("");
    return `
      <div class="text">
        <span class="chip">새 파일 자동 정리 프로그램</span>
        <h1>새 파일은 알아서,<br>쌓인 파일은 한&nbsp;번에.</h1>
        <p>AutoFolder는 <span class="nw">다운로드·바탕화면</span>에 쌓이는 파일을 원하는 폴더에 넣어 주는 <span class="nw">Windows 프로그램</span>이에요. 설치부터 한 장면씩 따라 해 보세요.</p>
        <div class="facts"><span>${CHECK}설치 5분</span><span>${CHECK}무엇이든 되돌릴 수 있어요</span><span>${CHECK}파일을 지우거나 덮어쓰지 않아요</span></div>
        <ol class="order" aria-label="이 설명서의 순서">${order}</ol>
      </div>
      <div class="tiles">
        <div class="tile">
          <img src="img/popup.png" alt="">
          <div><small><span class="star">★</span> 주요 기능 1</small><strong>새 파일이 오면</strong><p>오른쪽 아래에 뜨는 창에서 <span class="nw">폴더를 고르고</span> <span class="nw">[넣기]</span>. 한 번이면 끝.</p></div>
        </div>
        <div class="tile">
          <img src="img/classify.png" alt="">
          <div><small><span class="star">★</span> 주요 기능 2</small><strong>쌓여 있던 파일은</strong><p><span class="nw">[자동 분류]</span>가 폴더별로 나눠 줘요. 확인하고 <span class="nw">[나누기]</span>만 누르면 돼요.</p></div>
        </div>
      </div>`;
  }

  function faqHTML() {
    return `
      <div class="text"><span class="chip">자주 묻는 것</span><h2>걱정되는 것, 궁금한 것</h2></div>
      <div class="qa">${FAQ.map(([q, a]) => `<div><h3>${q}</h3><p>${fmt(a)}</p></div>`).join("")}</div>
      <p class="terms">교육·개인·업무 용도로 무료로 쓸 수 있어요<span class="nw">(판매는 할 수 없어요)</span>. <span class="nw">만든 사람 이용휘(화학 교사)</span> · <span class="nw">© 2026 이용휘</span></p>`;
  }

  function sceneHTML(sc) {
    if (sc.cover) return coverHTML();
    if (sc.faq) return faqHTML();
    const list = chScenes(sc.ch);
    const k = list.indexOf(sc) + 1;
    const star = CH.find((c) => c.key === sc.ch).star ? '<span aria-hidden="true">★</span> ' : "";
    return `
      <div class="text">
        <span class="chip">${star}${chName(sc.ch)}<span>${k} / ${list.length}</span></span>
        <h2>${fmt(sc.title)}</h2>
        ${sc.body.map((p) => `<p>${fmt(p)}</p>`).join("")}
        ${sc.copy ? `<div class="copy"><code>${sc.copy}</code><button type="button" data-copy="${sc.copy}">복사</button></div>` : ""}
        ${sc.tip ? `<div class="tip">${TIP_ICON}<span>${fmt(sc.tip)}</span></div>` : ""}
        ${sc.hl ? `<span class="legend"><i></i>주황 테두리가 누를 곳이에요</span>` : ""}
      </div>
      <figure class="fig">
        <img src="img/${sc.img}" alt="${sc.alt}">
        ${sc.ex ? `<figcaption class="extag">예시 그림 · 실제 화면과 조금 다를 수 있어요</figcaption>` : ""}
      </figure>`;
  }

  const stage = document.getElementById("stage");
  const toc = document.getElementById("toc");
  const bar = document.getElementById("bar");
  const count = document.getElementById("count");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");
  const ARROW = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  let cur = 0;

  CH.forEach((c) => {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.ch = c.key;
    b.innerHTML = (c.star ? '<span class="star" aria-hidden="true">★</span>' : "") + c.name;
    b.addEventListener("click", () => show(S.findIndex((x) => x.ch === c.key)));
    toc.appendChild(b);
    const seg = document.createElement("span");
    seg.dataset.ch = c.key;
    seg.style.flex = String(chScenes(c.key).length);
    seg.innerHTML = "<i></i>";
    bar.appendChild(seg);
  });

  function show(i, fromHash) {
    cur = Math.max(0, Math.min(S.length - 1, i));
    const sc = S[cur];
    const sec = document.createElement("section");
    sec.className = "scene" + (sc.cover ? " cover" : "") + (sc.faq ? " faq" : "");
    sec.id = sc.id;
    sec.tabIndex = -1;
    sec.setAttribute("aria-label", sc.title ? sc.title.replace(/\[\[|\]\]|\{\{|\}\}|==/g, "") : chName(sc.ch));
    sec.innerHTML = sceneHTML(sc);
    stage.replaceChildren(sec);

    const ci = CH.findIndex((c) => c.key === sc.ch);
    [...toc.children].forEach((b, k) => (k === ci ? b.setAttribute("aria-current", "step") : b.removeAttribute("aria-current")));
    toc.children[ci].scrollIntoView({ block: "nearest", inline: "nearest" });
    [...bar.children].forEach((seg, k) => {
      const list = chScenes(CH[k].key);
      const done = k < ci ? list.length : k === ci ? list.indexOf(sc) + 1 : 0;
      seg.firstChild.style.width = (done / list.length) * 100 + "%";
    });
    count.textContent = `${cur + 1} / ${S.length}`;
    prev.disabled = cur === 0;
    next.disabled = cur === S.length - 1;
    next.innerHTML = (cur === 0 ? "설치부터 보기" : "다음") + ARROW;
    if (!fromHash) {
      try { history.replaceState(null, "", "#" + sc.id); } catch (e) {}
    }
  }

  // 주소 복사
  stage.addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-copy]");
    if (!btn) return;
    const text = "https://" + btn.dataset.copy;
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (err) {}
    if (!ok) {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand("copy"); } catch (err) {}
      ta.remove();
    }
    if (!ok) {
      const r = document.createRange(); r.selectNodeContents(btn.previousElementSibling);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    }
    btn.textContent = ok ? "복사했어요" : "Ctrl+C로 복사";
    setTimeout(() => (btn.textContent = "복사"), 1800);
  });

  prev.addEventListener("click", () => show(cur - 1));
  next.addEventListener("click", () => show(cur + 1));
  document.addEventListener("keydown", (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); show(cur + 1); }
    if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); show(cur - 1); }
  });

  // 휴대폰: 옆으로 밀어 넘기기
  let sx = null, sy = 0;
  stage.addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  stage.addEventListener("touchend", (e) => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) show(cur + (dx < 0 ? 1 : -1));
    sx = null;
  });

  const fromHash = () => S.findIndex((x) => "#" + x.id === location.hash);
  const start = fromHash();
  show(start >= 0 ? start : 0, true);
  window.addEventListener("hashchange", () => { const k = fromHash(); if (k >= 0) show(k, true); });
})();
</script>
